<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="#fdfbf7" stroke="#1a365d" stroke-width="6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#d69e2e" stroke-width="3"/>
  
  <!-- Ethiopian Cross Pattern -->
  <g fill="#1a365d">
    <!-- Center Vertical -->
    <rect x="92" y="45" width="16" height="110" rx="3"/>
    <!-- Center Horizontal -->
    <rect x="45" y="92" width="110" height="16" rx="3"/>
    <!-- Cross Details -->
    <path d="M70,70 L130,130 M130,70 L70,130" stroke="#1a365d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="14" fill="#d69e2e"/>
  <circle cx="100" cy="100" r="8" fill="#ffffff"/>

  <!-- Text Arc Alternative / Banner -->
  <path id="textPath" d="M 25,100 A 75,75 0 1,1 175,100" fill="none"/>
  <text font-family="sans-serif" font-size="10" font-weight="bold" fill="#1a365d">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      ደብረ መንከራት ድቦ የኪዳነ ምህረት ገዳም
    </textPath>
  </text>
</svg>
